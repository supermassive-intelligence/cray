name: Test Python SDK compatibility

on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-python-compatibility.yml"
  push:
    branches:
      - main
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-python-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-smoke-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        run: python -m pip install ./sdk

      - name: Smoke test SDK
        run: |
          python -m pip check
          python -c "import masint; import scalarlm"
          scalarlm --help > /dev/null
